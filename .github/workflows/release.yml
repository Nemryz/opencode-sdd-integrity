name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -n 2 | tail -n 1 || echo "")
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "current_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        run: |
          tar czf opencode-sdd-integrity-${{ github.ref_name }}.tar.gz \
            AGENTS.md install.sh install.ps1 opencode.jsonc.example package.json \
            npm-shrinkwrap.json README.md LICENSE .github/ \
            agents/ commands/ templates/ skills/ tools/ plugins/ docs/

      - name: Verify release archive
        run: |
          tar tzf opencode-sdd-integrity-${{ github.ref_name }}.tar.gz > /tmp/release-files.txt
          node - <<'NODE'
          const fs = require('node:fs');
          const surface = require('./tools/install/surface.json');
          const entries = fs.readFileSync('/tmp/release-files.txt', 'utf8').split('\n').filter(Boolean);
          const files = new Set(entries);
          const missingFiles = [...surface.copyFiles, surface.exampleFile.source].filter((entry) => !files.has(entry));
          const missingDirs = surface.copyDirs.filter((dir) => !entries.some((entry) => entry.startsWith(`${dir}/`)));
          const missing = [...missingFiles, ...missingDirs];
          if (missing.length > 0) {
            console.error(`Release archive is missing: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`Release archive carries every path from the install surface (${surface.copyFiles.length} files and ${surface.copyDirs.length} directories).`);
          NODE

      - name: Generate checksum
        run: |
          shasum -a 256 opencode-sdd-integrity-${{ github.ref_name }}.tar.gz > opencode-sdd-integrity-${{ github.ref_name }}.tar.gz.sha256

      - name: Check the tag matches the package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the package version ${PACKAGE_VERSION}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package version ${PACKAGE_VERSION}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenCode SDD Integrity ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            opencode-sdd-integrity-${{ github.ref_name }}.tar.gz
            opencode-sdd-integrity-${{ github.ref_name }}.tar.gz.sha256
            install.sh
            install.ps1

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11

      - name: Publish to npm
        run: npm publish --access public --provenance
