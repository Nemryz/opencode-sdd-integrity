name: Actionlint

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz -C "$RUNNER_TEMP" actionlint

      - name: Lint the workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color
